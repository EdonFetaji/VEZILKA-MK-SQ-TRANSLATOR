[project]
name = "mksq-translategemma"
version = "0.2.0"
description = "Does learning a term's definition help a model translate it? TranslateGemma-12B, Macedonian <-> Albanian"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",    # tested with 5.24.1 (dtype=, AutoModelForImageTextToText)
    "trl>=1.18",            # tested with 1.18.2 (fused LM head, padding_free, completion_only_loss)
    "accelerate>=1.8",
    "datasets>=3.6",
    "numpy>=2",             # pyarrow>=21 refuses NumPy 1.x (the old uv.lock pinned 1.26.4)
    "pyarrow>=21",          # datasets 5 needs pa.json_ (pyarrow 17 in the old lock breaks `import datasets`)
    "huggingface-hub>=0.30",
    "hf_xet>=1.1",           # fast large-file uploads to the Hub
    "liger-kernel>=0.6; sys_platform == 'linux'",  # needs triton (no macOS wheels)
    "pyyaml>=6.0",
    "wandb>=0.21",
    "sentence-transformers>=3.0",  # LaBSE scoring of mined pairs when freezing tag G (TG-D0)          # live experiment tracking (src/pipeline/tracking.py)
    "sacrebleu>=2.4",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["pilot_nllb", "notebooks", "demo"]
