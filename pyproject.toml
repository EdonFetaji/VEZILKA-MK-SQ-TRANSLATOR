[project]
name = "mksq"
version = "0.1.0"
description = "Lexicon-aware domain adaptation for low-resource Macedonian-Albanian legal MT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned hard: Colab upgrades pyarrow underneath you (conventions, §11).
    "pyarrow==17.0.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "datasketch==1.6.5",
    "tqdm==4.66.5",
    "huggingface-hub>=0.36.2",
]

[project.optional-dependencies]
tokenize = [
    "transformers==4.44.2",
    "sentencepiece==0.2.0",
    "protobuf==5.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mksq"]
