[project]
name = "mksq-translategemma"
version = "0.2.0"
description = "Does learning a term's definition help a model translate it? TranslateGemma-12B, Macedonian <-> Albanian"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.56",
    "trl>=0.21",
    "accelerate>=1.8",
    "datasets>=3.6",
    "huggingface-hub>=0.30",
    "pyyaml>=6.0",
    "sacrebleu>=2.4",
    "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
extend-exclude = ["pilot_nllb", "notebooks", "demo"]
