extends: _arms.yaml
run_id: TG-33-s2
group: TG-33
description: Term pairs with definitions (V_DEF_CTX), the central test. Identical to TG-32 except the definition.
seed: 2

model:
  init_from: run:TG-20

data:
  mixture:
    - {name: V_DEF_CTX/verbis,         loader: verbis,         split: train, select: {exclude: V_HOLDOUT}, task: term_definition, directions: both, repeats: 3}
    - {name: V_DEF_CTX/media_literacy, loader: media_literacy, split: train, select: {exclude: V_HOLDOUT}, task: term_definition, directions: both, repeats: 3}

training:
  max_steps: 494
  micro_batch_rows: 4
  micro_batch_tokens: 8192
  grad_accum: 8
  tokens_per_step: 65536
  optimizer:
    name: adafactor
    beta1: null
    decay_rate: -0.8
    clip_threshold: 1.0
    eps: [1.0e-30, 0.001]
    scale_parameter: false
    relative_step: false
    warmup_init: false
    weight_decay: 0.0
  max_grad_norm: 1.0
  lr_schedule: {type: cosine, peak: 5.0e-06, min: 5.0e-07, warmup_start: 2.0e-07, warmup_steps: 15, constant_end_step: null, cooldown_steps: null}
  dev_loss_every_steps: 25
  save:
    every_steps: 100
    keep_steps: []
    with_optimizer: false
  resume: {from_run: null, from_step: null, optimizer_state: false, start_global_step: 0}
  gradient_checkpointing: true
  fused_cross_entropy: true
  bf16: true

output:
  local_dir: runs/TG-33-s2
  repo: auto
  push_weights: true

plan:
  plan_order: '13'
  stage: lexical
  priority: 1 core
  run_condition: after TG-20
  init_checkpoint: TG-20 final weights
  train_data: 'SHARED (~24M) + V_DEF_CTX: same 91,830 examples as TG-32 with the source-language definition added
    to each input (~8.4M)'
  est_train_hours_at_500_tok_s: '18.0'
  checkpoint_selection: final checkpoint, always
  save_at_end: bf16 weights
  decoded_eval_points: end only
  retention_check: FLORES_DEV chrF++ >= TG-20 minus 1.0 in each direction; report, never select on it
  notes: 'Central arm: entries, presentations and target tokens identical to TG-32; only the input differs.'
