# GENERATED from src/configs/tg_hyperparameters.csv by `python training_pipeline.py configs`.
# Edit the CSV and regenerate; only the `data:` section is hand-edited (it is kept on regeneration).
# The CSV wins over the SFT summary where they differ: max_grad_norm 1.0 (summary 0); lr peak 1e-05
# (summary 1e-5 or 5e-5); one GB10 device without FSDP (summary FSDP2 on 2 GPUs).

extends: _base.yaml
run_id: TG-10-CD10
group: TG-10
description: next 10% of TG-10's own G stream after the 1.0M-example checkpoint
seed: 1

model:
  init_from: run:TG-10

data:
  mixture:                  # tag G, one shuffle (seed 42) over both parts
    - name: G/human           # human translation: both directions
      loader: opus
      split: train
      select: {tag: G, source_ids: [SETIMES, TED2020, ELRC-5067-SciPar, GlobalVoices, EUbookshop, NeuLab-TedTalks, Tatoeba, ELRC-wikipedia_health]}
      task: translation
      directions: both
    - name: G/mined_subs      # NLLB top 900k, MultiHPLT top 300k (LaBSE >= 0.80), MultiMaCoCu, OpenSubtitles 100k: one direction each
      loader: opus
      split: train
      select: {tag: G, source_ids: [NLLB, MultiHPLT, MultiMaCoCu, OpenSubtitles]}
      task: translation
      directions: alternating
  eval:
    - {name: FLORES_DEV, loader: flores, split: dev, task: translation, directions: both}

training:
  max_steps: 199
  micro_batch_rows: 4
  micro_batch_tokens: 8192
  grad_accum: 8
  tokens_per_step: 65536
  optimizer:
    name: adafactor
    beta1: null
    decay_rate: -0.8
    clip_threshold: 1.0
    eps: [1.0e-30, 0.001]
    scale_parameter: false
    relative_step: false
    warmup_init: false
    weight_decay: 0.0
  max_grad_norm: 1.0
  lr_schedule: {type: cooldown, peak: 1.0e-05, min: 1.0e-06, warmup_start: null, warmup_steps: 0, constant_end_step: 1994, cooldown_steps: 199}
  dev_loss_every_steps: 20
  save:
    every_steps: null
    keep_steps: []
    with_optimizer: false
  resume: {from_run: TG-10, from_step: 1994, optimizer_state: true, start_global_step: 1994}
  gradient_checkpointing: true
  fused_cross_entropy: true
  bf16: true
  eval:
    select_on: [FLORES_DEV]
    metric: chrf++

output:
  local_dir: runs/TG-10-CD10
  repo: auto
  push_weights: true

plan:
  plan_order: '5'
  stage: general (size-check branch)
  priority: 1 core
  run_condition: after TG-10 reaches the checkpoint
  init_checkpoint: TG-10 constant-LR checkpoint at ~1.0M examples (step ~1994)
  train_data: next 10% of TG-10's own G stream after the 1.0M-example checkpoint
  est_train_hours_at_500_tok_s: '7.2'
  checkpoint_selection: final (candidate TG-10 endpoint)
  save_at_end: bf16 weights
  decoded_eval_points: end only
  retention_check: n/a
  notes: 'Branch, not a new stage: optimizer state carries over. planned_updates = 10% of the 1994 updates so far.'
