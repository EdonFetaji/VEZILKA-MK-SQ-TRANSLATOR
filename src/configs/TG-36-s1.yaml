extends: _arms.yaml
run_id: TG-36-s1
group: TG-36
description: 'SHARED (~24M) + V_TERM (~4.3M) + W_GEN: 7,388 MUSE pairs + 1,779 Goethe phrases, 3x per direction
  (~3.0M)'
seed: 1

model:
  init_from: run:TG-20

data:
  # V_TERM + W_GEN (MUSE pairs + Goethe phrases), 3x per direction
  mixture:
    - {name: V_TERM/verbis, loader: verbis, split: train, select: {exclude: V_HOLDOUT}, task: term_pair, directions: both, repeats: 3}
    - {name: V_TERM/media_literacy, loader: media_literacy, split: train, select: {exclude: V_HOLDOUT}, task: term_pair, directions: both, repeats: 3}
    - {name: W_GEN/muse, loader: muse, split: train, task: term_pair, directions: both, repeats: 3}
    - {name: W_GEN/phrasebook, loader: phrasebook, split: train, task: translation, directions: both, repeats: 3}

training:
  max_steps: 478
  micro_batch_rows: 4
  micro_batch_tokens: 8192
  grad_accum: 8
  tokens_per_step: 65536
  optimizer:
    name: adafactor
    beta1: null
    decay_rate: -0.8
    clip_threshold: 1.0
    eps: [1.0e-30, 0.001]
    scale_parameter: false
    relative_step: false
    warmup_init: false
    weight_decay: 0.0
  max_grad_norm: 1.0
  lr_schedule: {type: cosine, peak: 5.0e-06, min: 5.0e-07, warmup_start: 2.0e-07, warmup_steps: 15, constant_end_step: null, cooldown_steps: null}
  dev_loss_every_steps: 25
  save:
    every_steps: 100
    keep_steps: []
    with_optimizer: false
  resume: {from_run: null, from_step: null, optimizer_state: false, start_global_step: 0}
  gradient_checkpointing: true
  fused_cross_entropy: true
  bf16: true

output:
  local_dir: runs/TG-36-s1
  repo: auto
  push_weights: true

plan:
  plan_order: '20'
  stage: lexical
  priority: 3 extend
  run_condition: after TG-20
  init_checkpoint: TG-20 final weights
  train_data: 'SHARED (~24M) + V_TERM (~4.3M) + W_GEN: 7,388 MUSE pairs + 1,779 Goethe phrases, 3x per direction
    (~3.0M)'
  est_train_hours_at_500_tok_s: '17.4'
  checkpoint_selection: final checkpoint, always
  save_at_end: bf16 weights
  decoded_eval_points: end only
  retention_check: FLORES_DEV chrF++ >= TG-20 minus 1.0 in each direction; report, never select on it
